name: Expensive Component Tests

on:
  workflow_run:
    workflows: ["Gatekeeper - approvals"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

# щоб не ганяти старі запуски, коли з'явився новий коміт
concurrency:
  group: expensive-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  Component_Tests:
    # Біжимо ТІЛЬКИ якщо Gatekeeper був успішний і це саме подія pull_request
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # === МІНІМАЛЬНИЙ "демо"-тест ===
      - name: Heavy tests placeholder
        run: |
          echo "Running expensive component tests on $GITHUB_SHA"
          # тут у проді ти підставиш свої Playwright/Cypress тощо
          # npx playwright install --with-deps
          # npm ci && npm run test-ct
          sleep 5
          echo "Done"
