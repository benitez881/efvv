name: Gatekeeper_Approvals

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [master]
  pull_request_review:
    types: [submitted, dismissed]
    branches: [master]
  

permissions:
  contents: read
  pull-requests: read

jobs:
  approvals_gate_review:
    runs-on: ubuntu-latest
    # Ігноруємо коментарні ревʼю (commented). Обробляємо dismissed і submitted != commented
    if: >-
      ${{
        github.event.action == 'dismissed' ||
        (github.event.action == 'submitted' && github.event.review.state != 'commented')
      }}
    steps:
      - name: Debug event info
        run: |
          echo "Action: ${{ github.event.action }}"
          echo "Review state: ${{ github.event.review.state }}"

      - name: Passed non-comment filter
        run: echo "Review event passed filter (not commented)"

  approvals_gate_sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
    steps:
      - run: echo "Handle synchronize (Update branch / new head SHA)"
