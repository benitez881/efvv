name: Expensive Component Tests

on:
  workflow_run:
    workflows: ["Gatekeeper - approvals"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write  # потрібно для виставлення commit status

jobs:
  Component_Tests:
    # Працюємо лише коли Gatekeeper завершився успішно (є потрібна кількість апрувів)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Debug payload
        run: |
          echo "Gatekeeper conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Triggered by event: ${{ github.event.workflow_run.event }}"
          echo "PR head_sha: ${{ github.event.workflow_run.head_sha }}"

      # Тут ти підставиш свої реальні "важкі" тести; поки що просто демо-echo
      - name: Run expensive tests (placeholder)
        run: |
          echo "✅ Expensive component tests passed on $GITHUB_SHA"

      # Виставляємо SUCCESS-статус із контекстом, який зазначений у Branch Protection як required
      - name: Set SUCCESS status on PR commit
        env:
          GH_TOKEN: ${{ github.token }} # gh використовує GH_TOKEN
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api repos/$REPO/statuses/$SHA \
            -f state=success \
            -f context="Component_Tests" \
            -f description="Expensive component tests passed" \
            -f target_url="$RUN_URL"
