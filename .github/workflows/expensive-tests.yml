name: CI Pipeline

on:
  pull_request:
    branches:
      - '*'
  pull_request_review:
    types: [submitted]

env:
  REQUIRED_APPROVALS: 2

jobs:
  CI_Pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier
        run: npm run format -- --check
      - name: Build
        run: npm run build

  check_approvals:
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    outputs:
      approvals: ${{ steps.get_approvals.outputs.approvals }}
    steps:
      - name: Get PR approval count
        id: get_approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Could not find PR context. This action should only run on pull_request and pull_request_review events.');
              return;
            }
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const latestByUser = new Map();
            for (const r of reviews) {
              if (r.user) {
                latestByUser.set(r.user.id, r.state);
              }
            }
            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;
            core.notice(`Current approvals: ${approvals}`);
            core.setOutput('approvals', String(approvals));

  Component_Tests:
    runs-on: ubuntu-latest
    needs: [CI_Pipeline, check_approvals]
    # Запускаємо тести, якщо попередні кроки успішні та є достатньо апрувів
    if: success() && needs.check_approvals.outputs.approvals >= env.REQUIRED_APPROVALS
    steps:
      - name: Debug payload
        run: |
          echo "Gatekeeper conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Triggered by event: ${{ github.event.workflow_run.event }}"
          echo "PR head_sha: ${{ github.event.workflow_run.head_sha }}"

      # Тут ти підставиш свої реальні "важкі" тести; поки що просто демо-echo
      - name: Run expensive tests (placeholder)
        run: |
          echo "✅ Expensive component tests passed on $GITHUB_SHA"

      # Виставляємо SUCCESS-статус із контекстом, який зазначений у Branch Protection як required
      - name: Set SUCCESS status on PR commit
        env:
          GH_TOKEN: ${{ github.token }} # gh використовує GH_TOKEN
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api repos/$REPO/statuses/$SHA \
            -f state=success \
            -f context="Component_Tests" \
            -f description="Expensive component tests passed" \
            -f target_url="$RUN_URL"
