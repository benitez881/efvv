name: Expensive Component Tests

on:
  workflow_run:
    workflows: ["Gatekeeper - approvals"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  Component_Tests:
    # Працюємо тільки якщо Gatekeeper завершився успішно (>= потрібних апрувів)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Run heavy tests (placeholder)
        run: |
          echo "✅ Expensive component tests passed on commit: $GITHUB_SHA"
