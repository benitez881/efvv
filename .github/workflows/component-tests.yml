name: CT

on:
  workflow_run:
    workflows: [Gatekeeper_Approvals]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  resolve_ct_inputs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      pr_number: ${{ steps.out.outputs.pr_number }}
      head_sha:  ${{ steps.out.outputs.head_sha }}
    steps:
      - id: out
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const wr = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // 1) Спробуємо взяти PR з payload
            let prNumber = wr?.pull_requests?.[0]?.number;

            // 2) Якщо нема — шукаємо PR за комітом, на якому спрацював Gatekeeper
            if (!prNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: wr.head_sha
              });
              prNumber = prs[0]?.number;
            }

            if (!prNumber) {
              core.setFailed('Не знайшов повʼязаний PR для цього workflow_run.');
              return;
            }

            // 3) Критично: head_sha беремо з актуального PR, а не з wr.head_sha
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const prHeadSha = pr.head.sha;

            core.notice(`Resolved pr_number=${prNumber}; wr.head_sha=${wr.head_sha}; pr.head.sha=${prHeadSha}`);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha',  String(prHeadSha));

  # 2) Політика: 2 APPROVED і 0 CHANGES_REQUESTED test -
  policy_gate:
    runs-on: ubuntu-latest
    needs: resolve_ct_inputs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      approvals:  ${{ steps.eval.outputs.approvals }}
      has_changes: ${{ steps.eval.outputs.has_changes }}
    steps:
      - id: eval
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pr_number = Number('${{ needs.resolve_ct_inputs.outputs.pr_number }}');

            const allReviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr_number, per_page: 100 }
            );

            const latestByUser = new Map();
            for (const r of allReviews) {
              if (!r.user) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                latestByUser.set(r.user.id, r.state);
              }
            }

            const states = [...latestByUser.values()];
            const approvals = states.filter(s => s === 'APPROVED').length;
            const hasChanges = states.includes('CHANGES_REQUESTED');

            const shouldRun = approvals >= 2 && !hasChanges ? 'true' : 'false';
            core.notice(`policy: approvals=${approvals}, hasChanges=${hasChanges} => shouldRun=${shouldRun}`);

            core.setOutput('approvals', String(approvals));
            core.setOutput('has_changes', String(hasChanges));
            core.setOutput('should_run', shouldRun);

  ct_status_update:
    runs-on: ubuntu-latest
    needs: [resolve_ct_inputs, policy_gate]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: ct-${{ needs.resolve_ct_inputs.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Get current PR head SHA (fresh)
      # беремо свіжий SHA, щоб не було розсинхрону
        id: head
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr_number = Number('${{ needs.resolve_ct_inputs.outputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            core.setOutput('head_sha', pr.head.sha);

      - name: Set status to pending (either waiting policy or running tests)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ steps.head.outputs.head_sha }}';
            const shouldRun = '${{ needs.policy_gate.outputs.should_run }}' === 'true';
            const desc = shouldRun ? 'Component tests: running…' : 'Component tests: skipped by policy (pending)';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: 'Component_Tests_Godhelp',
              description: desc,
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

  # 3) Основний job: запускається ТІЛЬКИ коли політика виконана.
  #    Тут створюємо check-run на SHA PR, робимо "мокові" тести (echo),123
  #    і завершуємо check-run як success/failure.
  component_tests_godhelp:
    name: Component_Tests_Godhelp
    runs-on: ubuntu-latest
    needs: [resolve_ct_inputs, policy_gate, ct_status_update]
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.policy_gate.outputs.should_run == 'true' }}
    concurrency:
      group: ct-${{ needs.resolve_ct_inputs.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Get current PR head SHA (fresh)
        id: head
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pr_number = Number('${{ needs.resolve_ct_inputs.outputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
            core.notice(`Fresh PR head.sha=${pr.head.sha}`);
            core.setOutput('head_sha', pr.head.sha);
      
      - name: Set commit status pending
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ steps.head.outputs.head_sha }}';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'pending',
              context: 'Component_Tests_Godhelp',
              description: 'Component tests running…',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });
      
      
      - name: Debug list check-runs & statuses on this SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const ref   = '${{ steps.head.outputs.head_sha }}';
      
            // 1) Checks v2 (нові check-runs)
            const checks = await github.rest.checks.listForRef({ owner, repo, ref, per_page: 100 });
            core.notice('--- CHECK-RUNS ---');
            for (const c of checks.data.check_runs) {
              core.notice(`${c.name} | app=${c.app?.slug} | status=${c.status} | conclusion=${c.conclusion}`);
            }
      
            // 2) Legacy Statuses v1 (contexts)
            const comb = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
            core.notice('--- LEGACY STATUSES ---');
            for (const s of comb.data.statuses) {
              core.notice(`${s.context} | state=${s.state}`);
            }
          
      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.head_sha }}

      # ------- МОКОВІ ТЕСТИ (ЛИШЕ echo) -------
      - name: Mock install step
        run: echo "Skipping install - mock mode"

      - name: Mock component tests
        id: run_tests
        run: |
          echo "Running MOCK component tests..."
          echo "Pretend tests passed ✅"
          # Exit code 0 to simulate success
          exit 0
      # -----------------------------------------

      # success
      - name: Set commit status success (legacy)
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ steps.head.outputs.head_sha }}';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'success',
              context: 'Component_Tests_Godhelp',
              description: 'Component tests passed (MOCK)',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

      # failure
      - name: Set commit status failure (legacy)
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ steps.head.outputs.head_sha }}';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'failure',
              context: 'Component_Tests_Godhelp',
              description: 'Component tests failed (MOCK)',
              target_url: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });
