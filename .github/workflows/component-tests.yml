name: Component_Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Gatekeeper_Approvals]
    types: [completed]

jobs:
  check_approvals:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      approvals: ${{ steps.get_approvals.outputs.approvals }}
    steps:
      - name: Get PR approval count
        id: get_approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const wr = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1) Спробуємо взяти номер PR із payload
            let prNumber = wr.pull_requests && wr.pull_requests[0] && wr.pull_requests[0].number;

            // 2) Якщо нема — шукаємо PR за комітом
            if (!prNumber) {
              core.notice('no prNumber22')
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: wr.head_sha
              });
              prNumber = prs[0]?.number;
            }

            if (!prNumber) {
              core.setFailed('Не знайшов повʼязаний PR для цього workflow_run (pull_requests[] порожній і за head_sha PR не знайдено).');
              return;
            }

            core.notice(`Працюємо з PR #${prNumber}`);

            // Тягнемо всі review і рахуємо апруви по останньому стану кожного ревʼювера
            const allReviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const latestByUser = new Map();
            for (const review of allReviews) {
              if (review.user) {
                latestByUser.set(review.user.id, review.state);
              }
            }
            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;
            core.notice(`Current approvals21: ${approvals}`);
            core.setOutput('approvals', String(approvals));

  Component_Tests:
    runs-on: ubuntu-latest
    needs: [check_approvals]
    # Запускаємо тести, якщо попередні кроки успішні та є достатньо апрувів
    if: ${{ fromJSON(needs.check_approvals.outputs.approvals) >= 1 }}
    steps:
      - name: Debug payload
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha || github.sha }}"

      # Тут ти підставиш свої реальні "важкі" тести; поки що просто демо-echo
      - name: Run expensive tests (placeholder)
        run: |
          echo "1112✅ Expensive component tests passed on $GITHUB_SHA"
