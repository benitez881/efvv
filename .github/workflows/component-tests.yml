name: CT

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull Request number'
        required: false
        type: string
      head_sha:
        description: 'Head commit SHA of the PR'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  check_approvals:
    runs-on: ubuntu-latest
    outputs:
      approvals: ${{ steps.get_approvals.outputs.approvals }}
    steps:
      - name: Get PR approval count
        id: get_approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Отримуємо inputs з workflow_call -
            const prInput   = core.getInput('pr_number');
            const shaInput  = core.getInput('head_sha');

            let prNumber = prInput && prInput.trim() ? Number(prInput) : null;

            // Якщо PR не передали — спробуємо знайти за SHA
            if (!prNumber && shaInput) {
              core.notice('PR number not provided — resolving from head_sha');
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: shaInput
              });
              prNumber = prs[0]?.number || null;
            }

            if (!prNumber) {
              core.setFailed('Не знайшов PR: передай pr_number або head_sha у workflow_call.');
              return;
            }

            core.notice(`Працюємо з PR #${prNumber}`);

            // Тягнемо всі review і рахуємо апруви по останньому стану кожного ревʼювера
            const allReviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const latestByUser = new Map();
            for (const review of allReviews) {
              if (review.user && ['APPROVED','CHANGES_REQUESTED','DISMISSED','COMMENTED'].includes(review.state)) {
                latestByUser.set(review.user.id, review.state);
              }
            }

            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;
            core.notice(`Current approvals: ${approvals}`);
            core.setOutput('approvals', String(approvals));

  Component_Tests_Rest:
    runs-on: ubuntu-latest
    needs: [check_approvals]
    if: ${{ fromJSON(needs.check_approvals.outputs.approvals) >= 2 }}
    steps:
      - name: Debug inputs
        run: |
          echo "pr_number: ${{ inputs.pr_number }}"
          echo "head_sha:  ${{ inputs.head_sha }}"

      - name: Run expensive tests (placeholder)
        run: echo "✅ Expensive component tests passed on $GITHUB_SHA"
