name: Component_Tests

on:
  workflow_run:
    workflows: [Gatekeeper_Approvals]
    types: [completed]
    branches: [master]

jobs:
  check_approvals:
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    outputs:
      approvals: ${{ steps.get_approvals.outputs.approvals }}
    steps:
      - name: Get PR approval count
        id: get_approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Could not find PR context. This action should only run on pull_request and pull_request_review events.');
              return;
            }
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const latestByUser = new Map();
            for (const r of reviews) {
              if (r.user) {
                latestByUser.set(r.user.id, r.state);
              }
            }
            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;
            core.notice(`Current approvals: ${approvals}`);
            core.setOutput('approvals', String(approvals));

  Component_Tests:
    runs-on: ubuntu-latest
    needs: [check_approvals]
    # Запускаємо тести, якщо попередні кроки успішні та є достатньо апрувів
    if: ${{ success() && fromJSON(needs.check_approvals.outputs.approvals) >= 1 }}
    steps:
      - name: Debug payload
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha || github.sha }}"

      # Тут ти підставиш свої реальні "важкі" тести; поки що просто демо-echo
      - name: Run expensive tests (placeholder)
        run: |
          echo "222222222✅ Expensive component tests passed on $GITHUB_SHA"

      # Виставляємо SUCCESS-статус із контекстом, який зазначений у Branch Protection як required
      - name: Set SUCCESS status on PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api repos/$REPO/statuses/$SHA \
            -f state=success \
            -f context="Component_Tests" \
            -f description="Expensive component tests passed" \
            -f target_url="$RUN_URL"
