name: Component_Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Gatekeeper_Approvals]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  # 1) Визначаємо PR number і head_sha коміту PR (з payload або через пошук за комітом)
  resolve_ct_inputs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      pr_number: ${{ steps.out.outputs.pr_number }}
      head_sha: ${{ steps.out.outputs.head_sha }}
    steps:
      - id: out
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowRun = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            let prNumber = workflowRun?.pull_requests?.[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: workflowRun.head_sha
              });
              prNumber = prs[0]?.number;
            }

            if (!prNumber) {
              core.setFailed('Не знайшов повʼязаний PR для цього workflow_run (pull_requests[] порожній і за head_sha PR не знайдено).');
              return;
            }

            core.notice(`Resolved pr_number=${prNumber} head_sha=${workflowRun.head_sha}`);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha',  String(workflowRun.head_sha));

  # 2) Політика: 2 APPROVED і 0 CHANGES_REQUESTED
  policy_gate:
    runs-on: ubuntu-latest
    needs: resolve_ct_inputs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
    steps:
      - id: eval
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const pr_number = Number('${{ needs.resolve_ct_inputs.outputs.pr_number }}');

            const allReviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr_number, per_page: 100 }
            );

            const latestByUser = new Map();
            for (const review of allReviews) {
              if (!review.user) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                latestByUser.set(review.user.id, review.state);
              }
            }

            const states = [...latestByUser.values()];
            const approvals = states.filter(state => state === 'APPROVED').length;
            const blockers = states.includes('CHANGES_REQUESTED');

            const shouldRun = approvals >= 2 && !blockers ? 'true' : 'false';
            core.notice(`policy: approvals=${approvals}, blockers=${blockers} => shouldRun=${shouldRun}`);

            core.setOutput('approvals', String(approvals));
            core.setOutput('blockers', String(blockers));
            core.setOutput('should_run', shouldRun);

  # 3.1) Компонентні тести PayOrderModal (моки)
  Component_Tests_PayOrderModal:
    name: Component_Tests_PayOrderModal
    runs-on: liven-dev
    needs: [resolve_ct_inputs, policy_gate]
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.policy_gate.outputs.should_run == 'true' }}
    concurrency:
      group: ct-${{ needs.resolve_ct_inputs.outputs.pr_number }}
      cancel-in-progress: false

    steps:
      - name: Create CT-PayOrderModal check (in_progress) on PR SHA
        id: create_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const head_sha = `${{ needs.resolve_ct_inputs.outputs.head_sha }}`;
            const name = 'Component_Tests_PayOrderModal';

            const { data: check } = await github.rest.checks.create({
              owner, repo,
              name,
              head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString()
            });
            core.setOutput('check_run_id', String(check.id));
            core.notice(`Created check-run ${name} (${check.id}) on PR SHA ${head_sha}`);

      - uses: actions/checkout@v3
        with:
          ref: ${{ needs.resolve_ct_inputs.outputs.head_sha }}

      # ==== МОКИ ЗАМІСТЬ СПРАВЖНІХ ТЕСТІВ ====
      - name: Mock install
        run: |
          echo "Skipping npm ci / browser install. This is a mock run."

      - name: Mock run component tests for PayOrderModal
        id: run_tests
        run: |
          echo "Pretend we run: npm run test-ct -- src/tests/component_tests/PayOrderModal.spec.ts --workers=5"
          mkdir -p .test/spec/results
          echo "Fake PayOrderModal report" > .test/spec/results/report.txt

      - name: Upload test report (mock)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pay-order-modal
          path: .test/spec/results/
          retention-days: 30
          overwrite: true

      - name: Mark CT-PayOrderModal check as success
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.create_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Component tests passed (mock)',
                summary: 'PayOrderModal component tests passed (mocked).'
              }
            });

      - name: Mark CT-PayOrderModal check as failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.create_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Component tests failed (mock)',
                summary: 'PayOrderModal component tests failed (mock). Check job logs.'
              }
            });

  # 3.2) Решта компонентних тестів (моки)
  Component_Tests_Rest:
    name: Component_Tests_Rest
    runs-on: ubuntu-latest
    needs: [resolve_ct_inputs, policy_gate]
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.policy_gate.outputs.should_run == 'true' }}
    concurrency:
      group: ct-${{ needs.resolve_ct_inputs.outputs.pr_number }}

    steps:
      - name: Create CT-Rest check (in_progress) on PR SHA
        id: create_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const head_sha = `${{ needs.resolve_ct_inputs.outputs.head_sha }}`;
            const name = 'Component_Tests_Rest';

            const { data: check } = await github.rest.checks.create({
              owner, repo,
              name,
              head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString()
            });
            core.setOutput('check_run_id', String(check.id));
            core.notice(`Created check-run ${name} (${check.id}) on PR SHA ${head_sha}`);

      - uses: actions/checkout@v3
        with:
          ref: ${{ needs.resolve_ct_inputs.outputs.head_sha }}

      # ==== МОКИ ЗАМІСТЬ СПРАВЖНІХ ТЕСТІВ ====
      - name: Mock install
        run: |
          echo "Skipping npm ci / browser install. This is a mock run."

      - name: Mock run component tests (rest)
        id: run_tests
        run: |
          echo 'Pretend we run: npm run test-ct -- --grep-invert "PayOrderModal"'
          mkdir -p .test/spec/results
          echo "Fake REST report" > .test/spec/results/report.txt

      - name: Upload test report (mock)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rest
          path: .test/spec/results/
          retention-days: 30
          overwrite: true

      - name: Mark CT-Rest check as success
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.create_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Component tests passed (mock)',
                summary: 'Rest component tests passed (mocked).'
              }
            });

      - name: Mark CT-Rest check as failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.create_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Component tests failed (mock)',
                summary: 'Rest component tests failed (mock). Check job logs.'
              }
            });
