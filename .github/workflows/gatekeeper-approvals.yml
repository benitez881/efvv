name: Gatekeeper - approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

env:
  APPROVALS_REQUIRED: "2"

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Count approvals (latest state per reviewer)
        id: approvals
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) core.setFailed('No PR context');

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const latestByUser = new Map();
            for (const r of reviews) latestByUser.set(r.user.id, r.state);
            const approvals = [...latestByUser.values()].filter(s => s === 'APPROVED').length;

            core.notice(`Approvals: ${approvals}`);
            const need = parseInt(process.env.APPROVALS_REQUIRED || '2', 10);
            if (approvals < need) {
              core.setFailed(`Not enough approvals (need ≥${need})`);
            }
